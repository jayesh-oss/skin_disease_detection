{% extends "layout.html" %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8 col-lg-6">
        <div class="premium-card p-4 p-md-5 text-center">
            <h2 class="fw-bold text-primary mb-4">Analysis Complete</h2>
            
            <div class="position-relative d-inline-block mb-4">
                <img src="{{ image_path }}" alt="Analyzed Image" class="img-fluid rounded shadow-sm" style="max-height: 300px; object-fit: cover; border: 4px solid white;">
                <span class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-success p-2 border border-light shadow-sm">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-check-lg" viewBox="0 0 16 16">
                      <path d="M12.736 3.97a.733.733 0 0 1 1.047 0c.286.289.29.756.01 1.05L7.88 12.01a.733.733 0 0 1-1.065.02L3.217 8.384a.757.757 0 0 1 0-1.06.733.733 0 0 1 1.047 0l3.052 3.093 5.4-6.425a.247.247 0 0 1 .02-.022Z"/>
                    </svg>
                </span>
            </div>

            <div class="bg-light rounded p-4 mb-4 border">
                <p class="text-uppercase small fw-bold text-muted mb-1">Detected Condition</p>
                <h3 class="display-6 fw-bold text-dark mb-3">{{ prediction }}</h3>
                
                <div class="d-flex justify-content-between align-items-end mb-1">
                    <span class="text-muted small">Confidence Score</span>
                    <span class="fw-bold text-primary">{{ '%.1f' % (confidence * 100) }}%</span>
                </div>
                <div class="progress shadow-sm" style="height: 10px;">
                    <div class="progress-bar bg-primary progress-bar-striped progress-bar-animated" role="progressbar" style="width: {{ confidence * 100 }}%" aria-valuenow="{{ confidence * 100 }}" aria-valuemin="0" aria-valuemax="100"></div>
                </div>
            </div>

            <div class="d-flex flex-column flex-sm-row justify-content-center gap-3">
                <a href="/" class="btn btn-secondary-custom px-4">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-arrow-counterclockwise me-2" viewBox="0 0 16 16">
                      <path fill-rule="evenodd" d="M8 3a5 5 0 1 1-4.546 2.914.5.5 0 0 0-.908-.417A6 6 0 1 0 8 2v1z"/>
                      <path d="M8 4.466V.534a.25.25 0 0 0-.41-.192L5.23 2.308a.25.25 0 0 0 0 .384l2.36 1.966A.25.25 0 0 0 8 4.466z"/>
                    </svg>
                    Analyze Another
                </a>
                <a href="/dashboard" class="btn btn-primary-custom px-4">
                    View Dashboard
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-arrow-right ms-2" viewBox="0 0 16 16">
                      <path fill-rule="evenodd" d="M1 8a.5.5 0 0 1 .5-.5h11.793l-3.147-3.146a.5.5 0 0 1 .708-.708l4 4a.5.5 0 0 1 0 .708l-4 4a.5.5 0 0 1-.708-.708L13.293 8.5H1.5A.5.5 0 0 1 1 8z"/>
                    </svg>
                </a>
            </div>
            
            <p class="text-muted small mt-4 mb-0"><i class="bi bi-info-circle"></i> This result is for informational purposes only.</p>
        </div>
    </div>
</div>
{% endblock %}
