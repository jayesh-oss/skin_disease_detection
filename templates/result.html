<!DOCTYPE html>
<html>
<head>
  <title>Prediction Result</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light text-center py-5">
  <div class="container">
    <h2>🩺 Prediction Result</h2>
    <p class="fs-4">Disease: <strong>{{ prediction }}</strong></p>
    <p class="fs-5">Confidence: {{ '%.2f' % (confidence * 100) }}%</p>
    <img src="{{ image_path }}" alt="Uploaded Image" class="img-fluid rounded shadow mb-4" width="300">

    <h4>🛡 Prevention</h4>
    <p>{{ prevention }}</p>

    <h4>💊 Treatment</h4>
    <p>{{ treatment }}</p>

    <a href="/" class="btn btn-secondary mt-4">Upload Another</a>
  </div>
</body>
</html>
