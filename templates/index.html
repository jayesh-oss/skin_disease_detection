{% extends "layout.html" %}
{% block content %}
<div class="text-center">
    <h1 class="mb-4">Welcome to Skin Disease Detection</h1>
    {% if current_user.is_authenticated %}
        <form action="/predict" method="post" enctype="multipart/form-data" class="p-4 border rounded bg-white shadow-sm">
            <div class="mb-3">
                <input type="file" name="file" class="form-control" required>
            </div>
            <button type="submit" class="btn btn-primary">Upload & Predict</button>
        </form>
    {% else %}
        <p class="lead">Please <a href="/login">login</a> or <a href="/register">sign up</a> to use the system.</p>
    {% endif %}
</div>
{% endblock %}
