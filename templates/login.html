{% extends "layout.html" %}
{% block content %}
<div class="row justify-content-center align-items-center min-vh-75">
    <div class="col-md-5">
        <div class="premium-card p-5">
            <div class="text-center mb-4">
                <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" fill="currentColor" class="bi bi-person-circle text-primary mb-3" viewBox="0 0 16 16">
                  <path d="M11 6a3 3 0 1 1-6 0 3 3 0 0 1 6 0z"/>
                  <path fill-rule="evenodd" d="M0 8a8 8 0 1 1 16 0A8 8 0 0 1 0 8zm8-7a7 7 0 0 0-5.468 11.37C3.242 11.226 4.805 10 8 10s4.757 1.225 5.468 2.37A7 7 0 0 0 8 1z"/>
                </svg>
                <h3 class="fw-bold">Welcome Back</h3>
                <p class="text-muted">Please enter your credentials to login.</p>
            </div>
            
            <form method="post">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
                <div class="mb-4">
                    <label class="form-label fw-semibold text-muted small text-uppercase">Username</label>
                    <input type="text" name="username" class="form-control form-control-custom" placeholder="Enter your username" required>
                </div>
                <div class="mb-4">
                    <label class="form-label fw-semibold text-muted small text-uppercase">Password</label>
                    <input type="password" name="password" class="form-control form-control-custom" placeholder="Enter your password" required>
                </div>
                <button type="submit" class="btn btn-primary-custom w-100 btn-lg shadow-sm">Login</button>
            </form>
            
            <div class="text-center mt-4 pt-3 border-top">
                <p class="text-muted small">Don't have an account? <a href="/register" class="text-primary fw-bold text-decoration-none">Sign up here</a></p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
