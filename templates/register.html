{% extends "layout.html" %}
{% block content %}
<div class="row justify-content-center align-items-center min-vh-75">
    <div class="col-md-5">
        <div class="premium-card p-5">
            <div class="text-center mb-4">
                <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" fill="currentColor" class="bi bi-person-plus-fill text-secondary mb-3" viewBox="0 0 16 16">
                  <path d="M1 14s-1 0-1-1 1-4 6-4 6 3 6 4-1 1-1 1H1zm5-6a3 3 0 1 0 0-6 3 3 0 0 0 0 6z"/>
                  <path fill-rule="evenodd" d="M13.5 5a.5.5 0 0 1 .5.5V7h1.5a.5.5 0 0 1 0 1H14v1.5a.5.5 0 0 1-1 0V8h-1.5a.5.5 0 0 1 0-1H13V5.5a.5.5 0 0 1 .5-.5z"/>
                </svg>
                <h3 class="fw-bold">Create Account</h3>
                <p class="text-muted">Join us to use the prediction system.</p>
            </div>
            
            <form method="post">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
                <div class="mb-4">
                    <label class="form-label fw-semibold text-muted small text-uppercase">Username</label>
                    <input type="text" name="username" class="form-control form-control-custom" placeholder="Choose a username" required>
                </div>
                <div class="mb-4">
                    <label class="form-label fw-semibold text-muted small text-uppercase">Password</label>
                    <input type="password" name="password" class="form-control form-control-custom" placeholder="Create a password" required>
                </div>
                <button type="submit" class="btn btn-primary-custom w-100 btn-lg shadow-sm" style="background-color: var(--secondary-color);">Sign Up</button>
            </form>
            
            <div class="text-center mt-4 pt-3 border-top">
                <p class="text-muted small">Already have an account? <a href="/login" class="text-secondary fw-bold text-decoration-none">Login here</a></p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
