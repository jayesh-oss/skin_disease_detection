<!DOCTYPE html>
<html>
<head>
    <title>Skin Disease Detection</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="/">SkinDetect</a>
        <div>
            {% if current_user.is_authenticated %}
                <a class="btn btn-outline-light" href="/dashboard">Dashboard</a>
                <a class="btn btn-danger ms-2" href="/logout">Logout</a>
            {% else %}
                <a class="btn btn-outline-light" href="/login">Login</a>
                <a class="btn btn-primary ms-2" href="/register">Sign Up</a>
            {% endif %}
        </div>
    </div>
</nav>
<div class="container py-5">
    {% with messages = get_flashed_messages() %}
      {% if messages %}
        <div class="alert alert-warning">
          {% for message in messages %}
            <p>{{ message }}</p>
          {% endfor %}
        </div>
      {% endif %}
    {% endwith %}
    {% block content %}{% endblock %}
</div>
</body>
</html>
